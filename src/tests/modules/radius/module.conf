radius replicate {
	type = Accounting-Request

	mode = unconnected-replicate

	transport = udp

	udp {
		src_ipaddr = 127.0.0.1
	}
}

radius proxy {
	type = Access-Request

	mode = dynamic-proxy

	transport = udp

	udp {
		src_ipaddr = 127.0.0.1
		secret = testing123
	}

	Access-Request {
		initial_rtx_time = 1
		max_rtx_time = 5
		max_rtx_count = 1
		max_rtx_duration = 5
	}
}
